description: "2025년 6월 1,011만 회선으로 정점을 찍고 열 달 만에 사상 첫 연속 순유출을 맞은 한국 알뜰폰 시장. 산업 구조·경쟁 참가자·소비자·트렌드를 공개 데이터로 해부하고, 독립계 사업자 사례 연구로 \"1,000만 회선 이후\"의 생존 조건 7가지와 3단계 로드맵을 제시하는 내부 시장 분석서. 결론은 하나다 — 덜 잃는 자가 이긴다."
